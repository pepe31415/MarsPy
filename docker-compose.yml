version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: marspy-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: marspy
      MYSQL_USER: marspy
      MYSQL_PASSWORD: marspy123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marspy-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: marspy
      DB_USER: marspy
      DB_PASSWORD: marspy123
      JWT_SECRET: super_secret_jwt_key_change_in_production
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/assets:/app/assets

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marspy-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
